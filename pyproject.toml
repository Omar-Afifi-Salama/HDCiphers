[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdciphers"
version = "0.1.0"
authors = [
    { name="Omar Afifi" }
]
description = "A hyper-dynamic classical encryption, decryption, and text space telemetry library."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "numpy>=1.20.0"  # Declared package level dependency. Handled lazily inside Hill class!
]

[project.urls]
"Homepage" = "https://github.com/Omar-Afifi-Salama/HDCiphers"